# Pre-commit hooks for cutedsl-ops.
# Uses local hooks with `uv run ruff` so the ruff version is always
# consistent with the one in uv.lock — no separate binary download.
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true
